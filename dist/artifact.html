<title>解答用紙メーカー</title>
<style>
/* ===== 基本 ===== */
:root{
  --bg:#f4f6f8; --panel:#ffffff; --line:#d7dde3; --ink:#1b2733; --sub:#5b6976;
  --place:#1a6fd4; --place-bg:#e8f1fd; --input:#12a05a; --input-bg:#e6f6ed;
  --warn:#8a6412; --warn-bg:#fff6dd; --danger:#c0392b; --danger-bg:#fdecea;
  --key:#33404d; --field:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a20; --panel:#1e242b; --line:#333d47; --ink:#e7edf3; --sub:#9dabb8;
    --place:#63a8f2; --place-bg:#1b2b3c; --input:#45d195; --input-bg:#153023;
    --warn:#e3ba58; --warn-bg:#332b16; --danger:#ec8377; --danger-bg:#3a201d;
    --key:#55636f; --field:#262d35;
  }
}
:root[data-theme="dark"]{
  --bg:#151a20; --panel:#1e242b; --line:#333d47; --ink:#e7edf3; --sub:#9dabb8;
  --place:#63a8f2; --place-bg:#1b2b3c; --input:#45d195; --input-bg:#153023;
  --warn:#e3ba58; --warn-bg:#332b16; --danger:#ec8377; --danger-bg:#3a201d;
  --key:#55636f; --field:#262d35;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:system-ui,"Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; overflow:hidden;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--place);outline-offset:1px}

/* ===== 起動画面 ===== */
#start{
  position:fixed; inset:0; z-index:50; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#start .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:32px; max-width:720px; width:100%; box-shadow:0 8px 28px rgba(0,0,0,.08)}
#start h1{margin:0 0 4px;font-size:24px}
#start .lead{color:var(--sub);margin:0 0 24px}
.start-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.big-btn{
  flex:1 1 200px; min-height:82px; border:1px solid var(--line); border-radius:10px;
  background:var(--panel); cursor:pointer; text-align:left; padding:14px 16px; line-height:1.5;
}
.big-btn:hover:not(:disabled){border-color:var(--place);background:var(--place-bg)}
.big-btn:disabled{opacity:.45;cursor:not-allowed}
.big-btn b{display:block;font-size:16px;margin-bottom:2px}
.big-btn span{color:var(--sub);font-size:12px}
.subject-row{display:flex;gap:8px;flex-wrap:wrap}
.subject-btn{padding:10px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:inherit}
.subject-btn:hover{border-color:var(--place);background:var(--place-bg)}
.note{font-size:12px;color:var(--sub);margin-top:20px;line-height:1.7}

/* ===== アプリ枠 ===== */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}

/* 上部バー */
#topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#topbar .logo{font-weight:700;white-space:nowrap}
#topbar input[type=text]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;background:var(--field);color:inherit}
#title-input{width:260px}
#topbar select{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;background:var(--field);color:inherit}
.spacer{flex:1}
.tb{padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;white-space:nowrap;color:inherit}
.tb:hover{border-color:var(--place);background:var(--place-bg)}
.tb.primary{background:var(--place);border-color:var(--place);color:#fff;font-weight:600}
.tb.primary:hover{filter:brightness(1.08)}
.tb kbd{font-size:10px;color:var(--sub);margin-left:5px}
.zoom{display:flex;gap:0}
.zoom .tb{border-radius:0;margin-left:-1px}
.zoom .tb:first-child{border-radius:7px 0 0 7px;margin-left:0}
.zoom .tb:last-child{border-radius:0 7px 7px 0}
#zoom-label{font-size:12px;min-width:84px;display:inline-block;text-align:center}
.tool.line.on{background:var(--place);border-color:var(--place);color:#fff}
.tool.line.on .k{background:rgba(255,255,255,.28)}
.tb.primary kbd{color:#dbe9fb}

/* モード表示帯 */
#modebar{padding:5px 12px;font-weight:700;font-size:13px;letter-spacing:.02em;
  border-bottom:1px solid var(--line)}
#modebar.place{background:var(--place-bg);color:var(--place)}
#modebar.input{background:var(--input-bg);color:var(--input)}

/* 本体 2カラム */
#main{flex:1;display:flex;min-height:0}
#side{width:246px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px}
#side h2{font-size:11px;color:var(--sub);margin:16px 0 7px;letter-spacing:.08em}
#side h2:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tool{border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:inherit;
  padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.25}
.tool:hover{border-color:var(--place);background:var(--place-bg)}
.tool .nm{font-size:11.5px}
.tool .k{font-size:10px;font-weight:700;color:#fff;background:var(--key);
  border-radius:3px;padding:0 5px;letter-spacing:.03em}
.tool svg{display:block}
#tabs{display:flex;gap:6px;margin-top:16px}
.tab{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  cursor:pointer;font-size:12.5px;text-align:center;color:inherit}
.tab.on{background:var(--place);border-color:var(--place);color:#fff;font-weight:600}

/* プレビュー */
#preview{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px}
#paper{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.14);width:100%;max-width:1180px;margin:0 auto}
#sheet{display:block;width:100%;height:auto;touch-action:none}
#status{max-width:1180px;width:100%;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--sub)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px}
.chip.warn{background:var(--warn-bg);border-color:#e6cc7a;color:var(--warn);font-weight:600}
.chip.bad{background:var(--danger-bg);border-color:#efb3ac;color:var(--danger);font-weight:600}

/* セル入力欄 */
#cell-input{position:absolute;display:none;z-index:30;border:2px solid var(--input);
  border-radius:4px;background:var(--field);color:var(--ink);font:inherit;padding:2px 5px;min-width:120px;
  box-shadow:0 3px 12px rgba(0,0,0,.18)}

/* トースト */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:rgba(27,39,51,.94);color:#fff;padding:9px 18px;border-radius:999px;
  font-size:13px;opacity:0;transition:opacity .18s;pointer-events:none;max-width:82vw;text-align:center}
#toast.on{opacity:1}

/* モーダル */
.modal{position:fixed;inset:0;z-index:70;background:rgba(20,28,36,.42);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{background:var(--panel);border-radius:12px;padding:22px;min-width:320px;max-width:560px;
  width:100%;box-shadow:0 12px 40px rgba(0,0,0,.24);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:17px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.row>label{width:112px;flex:none;color:var(--sub);font-size:13px}
.row input[type=text],.row input[type=number],.row select{
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;flex:1;min-width:90px;
  background:var(--field);color:inherit}
.row .hint{font-size:11.5px;color:var(--sub);width:100%;margin-left:122px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{padding:7px 14px;background:var(--panel);border:0;cursor:pointer;border-right:1px solid var(--line);color:inherit}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--place);color:#fff;font-weight:600}
.modal .desc{font-size:12.5px;color:var(--sub);line-height:1.8;margin:0 0 14px}
.modal .desc b{color:var(--ink)}

/* 狭い画面（タブレット縦など）では道具を上に畳む */
@media (max-width:900px){
  #main{flex-direction:column}
  #side{width:auto;border-right:0;border-bottom:1px solid var(--line);
        max-height:44vh;padding:10px 16px}
  #preview{padding:12px 16px}
  #topbar{padding:8px 16px}
  #title-input{width:min(100%,260px)}
}

/* 印刷：A4の1枚にそのまま出す */
@media print{
  html,body{background:#fff;overflow:visible;margin:0;padding:0;height:auto}
  #start,#topbar,#modebar,#side,#status,#toast,.modal,#cell-input{display:none!important}
  #app{display:block!important;height:auto;overflow:visible}
  #main{display:block;height:auto;overflow:visible}
  #preview{padding:0;margin:0;display:block;overflow:visible;height:auto;gap:0}
  #paper{box-shadow:none;margin:0;padding:0;max-width:none;
         width:var(--pw)!important;height:var(--ph)!important}
  #sheet{display:block;width:var(--pw)!important;height:var(--ph)!important;max-width:none}
  .guide{display:none}
}
</style>

<div id="start">

    <p class="lead">テストの解答用紙と模範解答を、キーボードだけで手早く作ります。オフラインで動き、通信は一切しません。</p>
    <div class="start-row">

<!-- ===== アプリ ===== -->
<div id="app">
  <div id="topbar">

<script>
"use strict";
/* =====================================================================
   解答用紙メーカー v1.0
   docs/SPEC.md に従う単一HTMLツール。通信なし・外部依存なし。
   ===================================================================== */

/* ---------------------------------------------------------------
   1. 寸法の定数
   お手本Excel（docs/reference）の実測値をそのまま採用する。
     列幅 6.125（Excel単位）= 48px = 12.7mm（未縮小）
     行高 13.5pt = 4.7625mm（未縮小）
     印刷倍率 80% → 1文字マス = 幅10.16mm × 高さ7.62mm
   --------------------------------------------------------------- */
const COL_W_EXCEL = 6.125;              // Excel の列幅
const ROW_H_PT    = 13.5;               // Excel の行高（pt）
const MM_COL      = 12.7;               // 未縮小の列幅（mm）
const MM_ROW      = 25.4 * ROW_H_PT / 72; // 未縮小の行高（mm）= 4.7625
const SCALE       = 0.8;                // 印刷倍率
const CW          = MM_COL * SCALE;     // 印刷後の列幅 10.16mm
const RH          = MM_ROW * SCALE;     // 印刷後の行高 3.81mm
const CHAR_ROWS   = 2;                  // 1文字マス = 2行
const PAGE = { landscape:{w:297,h:210}, portrait:{w:210,h:297} };

// pt → 印刷後mm（SVG描画用）
const ptmm = pt => pt * 25.4 / 72 * SCALE;

// 罫線の強さ（同じ辺に複数の指定が来たら強い方を残す）
const BORDER_RANK = { hair:1, dotted:2, dashed:3, thin:4, mediumDashed:5, medium:6 };
// 画面描画用の線の見た目（mm）
const BORDER_VIEW = {
  hair:        {w:0.12, dash:'0.5 0.5'},
  dotted:      {w:0.22, dash:'0.35 0.55'},
  dashed:      {w:0.22, dash:'1 0.7'},
  thin:        {w:0.26, dash:null},
  mediumDashed:{w:0.5,  dash:'1.8 1.1'},
  medium:      {w:0.5,  dash:null}
};

/* ---------------------------------------------------------------
   2. 教科ごとの既定
   --------------------------------------------------------------- */
const SUBJECTS = {
  '国語':{orientation:'landscape',writing:'vertical'  ,numberStyle:'kanji'},
  '数学':{orientation:'portrait' ,writing:'horizontal',numberStyle:'arabic'},
  '英語':{orientation:'portrait' ,writing:'horizontal',numberStyle:'arabic'},
  '理科':{orientation:'portrait' ,writing:'horizontal',numberStyle:'arabic'},
  '社会':{orientation:'portrait' ,writing:'horizontal',numberStyle:'arabic'},
  'その他':{orientation:'portrait',writing:'horizontal',numberStyle:'arabic'}
};

const KANJI = ['一','二','三','四','五','六','七','八','九','十',
               '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
const MARU  = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const KANA  = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ';
const kanji = n => (n>=1 && n<=KANJI.length) ? KANJI[n-1] : String(n);
const maru  = n => (n>=1 && n<=20) ? MARU[n-1] : '('+n+')';
const kana  = n => (n>=1 && n<=KANA.length) ? KANA[n-1] : String(n);

/* ---------------------------------------------------------------
   3. ドキュメント（保存されるデータのすべて）
   --------------------------------------------------------------- */
let doc = null;          // 現在のドキュメント
let uid = 1;             // 欄のID採番

function computeGrid(paper){
  const p = PAGE[paper.orientation];
  const cols = Math.floor((p.w - paper.marginX*2 + 0.001) / CW);
  let rows   = Math.floor((p.h - paper.marginY*2 + 0.001) / RH);
  if (rows % CHAR_ROWS) rows -= rows % CHAR_ROWS;   // 文字マスで割り切れるように
  return { cols, rows };
}

function makeTitle(p){
  const parts = ['第'+p.grade+'学年'];
  if (p.term)     parts.push(p.term);
  if (p.testName) parts.push(p.testName);
  parts.push('解答用紙');
  return parts.join('　');
}
function makeNameLabel(p){
  return p.nameOrder==='short'
    ? '　　組　　番　氏名（　　　　　　　）'
    : p.grade+'年　　組　　番　氏名（　　　　　　　）';
}

function newDoc(subject){
  const s = SUBJECTS[subject] || SUBJECTS['その他'];
  const paper = {
    subject, orientation:s.orientation, writing:s.writing,
    marginX:8, marginY:9,
    grade:'一', term:'', testName:'学年末テスト',
    nameOrder:'full', showScoreBox:true, numberStyle:s.numberStyle
  };
  paper.title = makeTitle(paper);
  paper.nameLabel = makeNameLabel(paper);
  const d = {
    version:1, paper, grid:computeGrid(paper),
    fields:[], decorations:[], texts:{}, answers:{}
  };
  uid = 1;
  return d;
}

/* ---------------------------------------------------------------
   4. ヘッダー（タイトル・氏名欄・得点枠）
   お手本と同じ位置に自動配置する。ここは欄を置けない予約領域。
     縦書き：右端＝タイトル、その左＝氏名欄、右下＝得点枠
     横書き：上＝タイトルと氏名欄、右上＝得点枠
   --------------------------------------------------------------- */
const SCORE_ASPECTS = [
  { key:'合計',    label:'合計' },
  { key:'思判表',  label:'思・判・表' },
  { key:'知技',    label:'知・技' }
];
// お手本 R6 の得点枠（W29:Y47）に合わせる。
// 太めの外枠1つだけで、中に「合計　１００／思・判・表　５０／知・技　５０」。
// 仕切り線は引かない（余白が得点の書き込み場所になる）。
const V_SCORE_H = 20;     // 縦書き得点枠の高さ（行）
const H_SCORE_W = 6;      // 横書き得点枠の幅（列）
const H_SCORE_H = 8;      // 横書き得点枠の高さ（行）

function headerLayout(d){
  const { cols, rows } = d.grid;
  const vertical = d.paper.writing === 'vertical';
  const texts = [];      // {c,r,t,size,bold,align}
  const borders = [];    // {c,r,w,h,style,inner}
  const reserved = new Set();
  const mark = (c,r,w,h) => { for(let i=0;i<w;i++) for(let j=0;j<h;j++) reserved.add((c+i)+','+(r+j)); };
  const totals = scoreTotals(d);

  if (vertical){
    // 右端2列：タイトル・氏名欄（1文字 = 2行）
    const put = (col, str, size) => {
      for (let i=0;i<str.length;i++){
        const r = i*CHAR_ROWS;
        if (r >= rows) break;
        texts.push({c:col, r, t:str[i], size, bold:size>=14});
      }
      mark(col, 0, 1, rows);
    };
    put(cols-1, d.paper.title, 14);
    put(cols-2, d.paper.nameLabel, 11);

    // 得点枠：氏名欄の左3列、下端（お手本の W29:Y47 と同じ位置）
    if (d.paper.showScoreBox){
      const c0 = cols-5, r0 = rows - V_SCORE_H;
      SCORE_ASPECTS.forEach((a, i) => {
        const col = c0 + (2 - i);              // 右から 合計 → 思・判・表 → 知・技
        const line = scoreLine(a.label, totals[a.key]);
        for (let k=0;k<line.length;k++){
          const r = r0 + 1 + k;                      // 1行に1文字（お手本と同じ詰まり具合）
          if (r < r0 + V_SCORE_H && line[k] !== '　') texts.push({c:col, r, t:line[k], size:11});
        }
      });
      borders.push({c:c0, r:r0, w:3, h:V_SCORE_H, style:'medium'});
      mark(c0, r0, 3, V_SCORE_H);
    }
  } else {
    // 横書き：タイトルと氏名欄は1セルに入れて右へあふれさせる（結合しない）
    texts.push({c:0, r:0, t:d.paper.title,     size:14, bold:true, align:'left'});
    texts.push({c:0, r:2, t:d.paper.nameLabel, size:11, align:'left'});
    mark(0, 0, cols, 4);

    // 得点枠：右上。縦書きと同じく太枠1つの中に3区分を並べる
    if (d.paper.showScoreBox){
      const c0 = cols - H_SCORE_W, r0 = 0;
      SCORE_ASPECTS.slice().reverse().forEach((a, i) => {   // 左から 知・技 → 思・判・表 → 合計
        texts.push({c:c0, r:r0 + 1 + i*CHAR_ROWS,
                    t:scoreLine(a.label, totals[a.key]), size:10, align:'left'});
      });
      borders.push({c:c0, r:r0, w:H_SCORE_W, h:H_SCORE_H, style:'medium'});
      mark(c0, r0, H_SCORE_W, H_SCORE_H);
    }
  }
  return { texts, borders, reserved };
}

// 得点枠の1行。お手本と同じく「合計　　　１００」のように、
// ラベルを5文字にそろえて全角数字を続ける（縦に並べたとき数字の位置がそろう）
const toFullWidth = n => String(n).replace(/[0-9]/g, d => String.fromCharCode(d.charCodeAt(0)+0xFEE0));
function scoreLine(label, points){
  return (label + '　　　　　').slice(0,5) + toFullWidth(points);
}

// 観点別の配点合計（欄の配点を積み上げる）
function scoreTotals(d){
  let ki=0, si=0;
  for (const f of d.fields){
    const p = Number(f.points)||0;
    if (f.aspect === '思判表') si += p; else ki += p;
  }
  return { '知技':ki, '思判表':si, '合計':ki+si };
}

// 欄を置き始める位置（ヘッダーと得点枠を避ける）
function contentOrigin(d){
  const box = d.paper.showScoreBox;
  return d.paper.writing==='vertical'
    ? { c: d.grid.cols - (box ? 6 : 3), r: 0 }
    : { c: 0, r: box ? 10 : 4 };
}

/* ---------------------------------------------------------------
   5. 欄（フィールド）の形
   欄は矩形の集合。記述が複数列に分かれるため配列で持つ。
   矩形は読む順に並べる（縦書き＝右の列から左へ、各列は上から下）。
   --------------------------------------------------------------- */
const FIELD_DEFS = {
  1:{ name:'シンプル枠', hint:'選んだ範囲に罫線を引く（解答欄ではなく枠だけ）' },
  2:{ name:'記号用',    hint:'記号1文字の解答欄' },
  3:{ name:'文字数',    hint:'字数を決めた記述の解答欄' },
  4:{ name:'長方形',    hint:'縦×横のマス数で四角い解答欄' },
  5:{ name:'グラフ',    hint:'xyグラフ（原点 O）' }
};
const GRAPH_ROWS = 3;    // グラフの1マス＝3行（約1cm四方になる）

// 欄の矩形を組み立てる。置けないときは null と理由を返す。
function buildRects(d, type, at, opt){
  const vertical = d.paper.writing==='vertical';
  const { cols, rows } = d.grid;
  const rects = [];

  if (type===2 || type===3){
    // 文字マスを連ねる欄。文字数の欄は入り切らないとき複数の行（列）に分ける
    const n = (type===2) ? 1 : Math.max(1, Number(opt.n)||1);
    const per = vertical
      ? Math.floor((rows - at.r) / CHAR_ROWS)     // 1列に入る文字数
      : (cols - at.c);                            // 1行に入る文字数
    if (per < 1) return { error:'この位置には入りません' };
    if (type===2 && n > per) return { error:'この位置には入りません' };

    let counts;
    if (n <= per) counts = [n];
    else {
      const lines = Math.ceil(n / per);
      const each  = Math.ceil(n / lines);          // できるだけ均等に割る
      counts = [];
      let left = n;
      for (let i=0;i<lines;i++){ const t = Math.min(each, left); counts.push(t); left -= t; }
      if (left > 0) return { error:'この位置には入りません' };
    }
    counts.forEach((cnt, i) => {
      if (vertical) rects.push({ c: at.c - i, r: at.r, w:1, h: cnt*CHAR_ROWS });
      else          rects.push({ c: at.c, r: at.r + i*CHAR_ROWS, w: cnt, h: CHAR_ROWS });
    });
  }
  else if (type===4){
    // 長方形：縦（マス）× 横（マス）
    const tate = Math.max(1, Number(opt.tate)||3);
    const yoko = Math.max(1, Number(opt.yoko)||4);
    const h = tate * CHAR_ROWS;
    if (vertical) rects.push({ c: at.c - yoko + 1, r: at.r, w:yoko, h });
    else          rects.push({ c: at.c, r: at.r, w:yoko, h });
  }
  else if (type===5){
    // グラフ：原点が真ん中に来るよう、縦横とも偶数マスにする
    let w = Math.max(2, Number(opt.w)||8), h = Math.max(2, Number(opt.h)||8);
    if (w % 2) w++;
    if (h % 2) h++;
    const hh = h * GRAPH_ROWS;
    if (vertical) rects.push({ c: at.c - w + 1, r: at.r, w, h:hh });
    else          rects.push({ c: at.c, r: at.r, w, h:hh });
  }

  for (const r of rects){
    if (r.c < 0 || r.r < 0 || r.c + r.w > cols || r.r + r.h > rows)
      return { error:'用紙からはみ出します（A4・1枚に収まる範囲で置いてください）' };
  }
  return { rects };
}

// 番号欄の位置と大きさ（お手本と同じく、解答欄の直前に置く小さなマス）
//   縦書き：解答欄の1行上（高さ1行）／横書き：解答欄の1列左（高さは解答欄と同じ）
function labelRect(d, at){
  return d.paper.writing==='vertical'
    ? { c:at.c, r:at.r, w:1, h:1 }
    : { c:at.c, r:at.r, w:1, h:CHAR_ROWS };
}
// 番号欄を置いたとき、解答欄が始まる位置
function boxStart(d, at){
  return d.paper.writing==='vertical'
    ? { c:at.c, r:at.r+1 }
    : { c:at.c+1, r:at.r };
}

// 欄が実際に使うセル（番号欄も含む）
function fieldFootprint(d, f){
  const cells = [];
  for (const r of f.rects)
    for (let i=0;i<r.w;i++) for (let j=0;j<r.h;j++) cells.push([r.c+i, r.r+j]);
  if (f.label)
    for (let i=0;i<f.label.w;i++) for (let j=0;j<f.label.h;j++) cells.push([f.label.c+i, f.label.r+j]);
  return cells;
}

// 「欄に入れる文字」を置くマス。先頭・中央・お尻から選ぶ
function noteCells(d, f){
  const t = f.note || '';
  if (!t) return [];
  const list = charCells(d, f);
  const n = Math.min(t.length, list.length);
  let start = 0;
  if (f.notePos === 'end')    start = list.length - n;
  if (f.notePos === 'center') start = Math.floor((list.length - n) / 2);
  return list.slice(start, start + n);
}

// 模範解答が入るマス（「欄に入れる文字」のマスをよける）
function answerCells(d, f){
  const used = new Set(noteCells(d, f).map(p => p.c+','+p.r));
  return charCells(d, f).filter(p => !used.has(p.c+','+p.r));
}

// 欄の文字マス（模範解答を1文字ずつ並べるための順序つきリスト）
function charCells(d, f){
  const vertical = d.paper.writing==='vertical';
  const out = [];
  for (const r of f.rects){
    if (vertical){
      for (let c = r.c + r.w - 1; c >= r.c; c--)               // 右の列から左へ
        for (let y = r.r; y < r.r + r.h; y += CHAR_ROWS) out.push({c, r:y});
    } else {
      for (let y = r.r; y < r.r + r.h; y += CHAR_ROWS)         // 上の行から下へ
        for (let c = r.c; c < r.c + r.w; c++) out.push({c, r:y});
    }
  }
  return out;
}

/* ---------------------------------------------------------------
   6. セルの組み立て
   画面もExcelもこの結果だけを見て描く（ズレを起こさないため）。
   --------------------------------------------------------------- */
function buildCells(d, withAnswers){
  const cells = new Map();
  const get = (c,r) => {
    const k = c+','+r;
    let x = cells.get(k);
    if (!x){ x = {c,r,t:'',size:11,bold:false,align:'center',b:{}}; cells.set(k,x); }
    return x;
  };
  const line = (c,r,side,style) => {
    if (c<0||r<0||c>=d.grid.cols||r>=d.grid.rows) return;
    const x = get(c,r), cur = x.b[side];
    if (!cur || BORDER_RANK[style] > BORDER_RANK[cur]) x.b[side] = style;
  };
  // 矩形の外枠
  const box = (c,r,w,h,style) => {
    for (let i=0;i<w;i++){ line(c+i, r, 'top', style); line(c+i, r+h-1, 'bottom', style); }
    for (let j=0;j<h;j++){ line(c, r+j, 'left', style); line(c+w-1, r+j, 'right', style); }
  };
  // mid=true なら1文字マス（2行）の真ん中に置く（Excelでは2行を結合する）
  const put = (c,r,t,size,bold,align,mid) => {
    if (c<0||r<0||c>=d.grid.cols||r>=d.grid.rows) return;
    const x = get(c,r); x.t = t; x.size = size||11; x.bold = !!bold; x.align = align||'center';
    x.mid = !!mid && (r+1 < d.grid.rows);
  };

  // (1) ヘッダー
  const head = headerLayout(d);
  head.borders.forEach(b => box(b.c,b.r,b.w,b.h,b.style));
  head.texts.forEach(t => put(t.c,t.r,t.t,t.size,t.bold,t.align));

  // (2) 欄
  const vertical = d.paper.writing==='vertical';
  for (const f of d.fields){
    const outer = f.complete ? 'medium' : 'thin';
    f.rects.forEach(r => box(r.c, r.r, r.w, r.h, outer));
    // 太線モードで作った欄は、番号欄の外枠も太線にする
    if (f.label) box(f.label.c, f.label.r, f.label.w, f.label.h, outer);

    if (f.type===3){
      // 文字の区切り（点線）と8割ライン
      f.rects.forEach(r => {
        if (vertical){
          for (let y = r.r + CHAR_ROWS; y < r.r + r.h; y += CHAR_ROWS)
            for (let i=0;i<r.w;i++) line(r.c+i, y, 'top', 'dotted');
        } else {
          for (let c = r.c + 1; c < r.c + r.w; c++)
            for (let j=0;j<r.h;j++) line(c, r.r+j, 'left', 'dotted');
        }
      });
      if (!f.exact && f.chars >= 5){
        const at = Math.floor(f.chars * 0.8);
        const cellsList = charCells(d, f);
        if (at >= 1 && at < cellsList.length){
          const p = cellsList[at];
          const own = f.rects.find(x => p.c>=x.c && p.c<x.c+x.w && p.r>=x.r && p.r<x.r+x.h) || f.rects[0];
          if (vertical) for (let i=0;i<own.w;i++) line(own.c+i, p.r, 'top', 'mediumDashed');
          else          for (let j=0;j<own.h;j++) line(p.c, own.r+j, 'left', 'mediumDashed');
        }
      }
    }
    if (f.type===5){
      // xyグラフ：細い破線の方眼＋真ん中を通るx軸y軸＋原点のO
      const r = f.rects[0];
      const gw = r.w, gh = r.h / GRAPH_ROWS;
      const midC = r.c + gw/2, midR = r.r + (gh/2)*GRAPH_ROWS;
      for (let c = r.c+1; c < r.c+gw; c++)
        for (let j=0;j<r.h;j++) line(c, r.r+j, 'left', 'hair');
      for (let k=1;k<gh;k++)
        for (let i=0;i<gw;i++) line(r.c+i, r.r+k*GRAPH_ROWS, 'top', 'hair');
      for (let j=0;j<r.h;j++) line(midC, r.r+j, 'left', 'thin');      // y軸
      for (let i=0;i<gw;i++)  line(r.c+i, midR, 'top', 'thin');       // x軸
      put(midC-1, midR, 'O', 9, false, 'center');                      // 原点
    }
    // 欄に入れる文字（先頭・中央・お尻）
    if (f.note){
      const ps = noteCells(d, f);
      ps.forEach((p,i) => put(p.c, p.r, f.note[i], 11, false, 'center', true));
    }
  }

  // (3) 太枠（選択範囲に引いた枠）
  d.decorations.forEach(v => box(v.c, v.r, v.w, v.h, v.style || 'medium'));

  // (4) 入力した文字・振った番号
  for (const k in d.texts){
    const [c,r] = k.split(',').map(Number);
    const v = d.texts[k];
    if (!v || v.t === '') continue;
    put(c, r, v.t, v.size||11, v.bold, v.align);
    if (v.box){                      // 大問番号・問番号のセルにも枠を引く
      const h = d.paper.writing==='vertical' ? 1 : CHAR_ROWS;
      box(c, r, 1, h, 'thin');
    }
  }

  // (5) 模範解答
  if (withAnswers){
    for (const f of d.fields){
      const a = d.answers[f.id];
      if (!a) continue;
      const list = answerCells(d, f);
      for (let i=0;i<a.length && i<list.length;i++)
        put(list[i].c, list[i].r, a[i], 11, false, 'center', true);
    }
  }
  return cells;
}

/* ---------------------------------------------------------------
   7. 画面の状態
   --------------------------------------------------------------- */
const ui = {
  zoom:0,                // 0 = 画面に合わせる。それ以外は倍率
  line:'thin',           // 罫線の太さ（'thin' 普通 / 'medium' 太線）
  mode:'place',          // 'place' | 'input'
  tab:'sheet',           // 'sheet' | 'answer'
  cur:{c:0,r:0},         // カーソル
  sel:null,              // 選択範囲 {c,r,w,h}（矩形）
  extra:[],              // Ctrl+クリックで足したセル [{c,r}]
  dirty:false,
  editTarget:null,       // 入力モードの対象
  reserved:new Set()
};
const history = { sheet:{undo:[],redo:[]}, answer:{undo:[],redo:[]} };

const $  = s => document.querySelector(s);
const svg = $('#sheet');

// 履歴には「選んでいた範囲」も一緒に残す
function state(){
  return JSON.stringify({ doc, cur:ui.cur, sel:ui.sel, extra:ui.extra });
}
function restore(json){
  const st = JSON.parse(json);
  doc = st.doc;
  ui.cur = st.cur || {c:0,r:0};
  ui.sel = st.sel || null;
  ui.extra = st.extra || [];
  ui.selAnchor = null;
}
function snapshot(){
  const h = history[ui.tab];
  h.undo.push(state());
  if (h.undo.length > 120) h.undo.shift();
  h.redo.length = 0;
  ui.dirty = true;
}
function undo(){
  const h = history[ui.tab];
  if (!h.undo.length) return toast('これ以上は戻せません');
  h.redo.push(state());
  restore(h.undo.pop());
  render(); toast('戻しました（選んだ範囲はそのままです）');
}
function redo(){
  const h = history[ui.tab];
  if (!h.redo.length) return toast('やり直せる操作はありません');
  h.undo.push(state());
  restore(h.redo.pop());
  render(); toast('やり直しました');
}

/* ---------------------------------------------------------------
   8. 描画（SVG。印刷そのままの寸法で描く）
   --------------------------------------------------------------- */
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (n, a) => { const e = document.createElementNS(SVGNS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };
let geo = null;   // {x0,y0,pw,ph} 用紙上のグリッド原点

function render(){
  const p = PAGE[doc.paper.orientation];
  const { cols, rows } = doc.grid;
  const gw = cols*CW, gh = rows*RH;
  const x0 = (p.w - gw)/2, y0 = (p.h - gh)/2;   // Excel の「中央に印刷」と同じ
  geo = { x0, y0, pw:p.w, ph:p.h };
  svg.setAttribute('viewBox', '0 0 '+p.w+' '+p.h);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  fitPreview(p);
  document.documentElement.style.setProperty('--pw', p.w+'mm');
  document.documentElement.style.setProperty('--ph', p.h+'mm');
  setPageRule(doc.paper.orientation);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(el('rect',{x:0,y:0,width:p.w,height:p.h,fill:'#fff'}));

  const head = headerLayout(doc);
  ui.reserved = head.reserved;
  const cells = buildCells(doc, ui.tab==='answer');

  // 下地：うすいマス目（印刷されない案内線）
  const guide = el('g',{stroke:'#e3e8ee','stroke-width':0.08,'class':'guide'});
  for (let c=0;c<=cols;c++) guide.appendChild(el('line',{x1:x0+c*CW,y1:y0,x2:x0+c*CW,y2:y0+gh}));
  for (let r=0;r<=rows;r+=CHAR_ROWS) guide.appendChild(el('line',{x1:x0,y1:y0+r*RH,x2:x0+gw,y2:y0+r*RH}));
  svg.appendChild(guide);

  // 予約領域（ヘッダー）の淡い塗り
  const resg = el('g',{fill:'#f2f5f8','class':'guide'});
  ui.reserved.forEach(k=>{
    const [c,r] = k.split(',').map(Number);
    resg.appendChild(el('rect',{x:x0+c*CW,y:y0+r*RH,width:CW,height:RH}));
  });
  svg.appendChild(resg);

  // 選択範囲
  if (ui.sel){
    svg.appendChild(el('rect',{x:x0+ui.sel.c*CW, y:y0+ui.sel.r*RH, 'class':'guide',
      width:ui.sel.w*CW, height:ui.sel.h*RH, fill:'#1a6fd4', 'fill-opacity':0.12}));
  }
  ui.extra.forEach(p=>{
    svg.appendChild(el('rect',{x:x0+p.c*CW, y:y0+p.r*RH, width:CW, height:RH,
      'class':'guide', fill:'#1a6fd4','fill-opacity':0.18}));
  });

  // 罫線
  const lines = el('g',{'stroke-linecap':'square'});
  cells.forEach(x=>{
    const X = x0 + x.c*CW, Y = y0 + x.r*RH;
    const seg = (side) => {
      const st = x.b[side]; if (!st) return;
      const v = BORDER_VIEW[st];
      const a = {stroke:'#000','stroke-width':v.w};
      if (v.dash) a['stroke-dasharray'] = v.dash;
      if (side==='top')    Object.assign(a,{x1:X,y1:Y,x2:X+CW,y2:Y});
      if (side==='bottom') Object.assign(a,{x1:X,y1:Y+RH,x2:X+CW,y2:Y+RH});
      if (side==='left')   Object.assign(a,{x1:X,y1:Y,x2:X,y2:Y+RH});
      if (side==='right')  Object.assign(a,{x1:X+CW,y1:Y,x2:X+CW,y2:Y+RH});
      lines.appendChild(el('line',a));
    };
    seg('top'); seg('bottom'); seg('left'); seg('right');
  });
  svg.appendChild(lines);

  // 文字
  const texts = el('g',{'font-family':'"Yu Gothic","Yu Gothic UI","Meiryo",sans-serif'});
  cells.forEach(x=>{
    if (!x.t) return;
    const fs = ptmm(x.size);
    const a = { y: y0 + x.r*RH + (x.mid ? RH : RH/2), 'font-size':fs, fill:'#000',
                'dominant-baseline':'central' };
    if (x.align==='left'){ a.x = x0 + x.c*CW + 0.4; a['text-anchor']='start'; }
    else { a.x = x0 + x.c*CW + CW/2; a['text-anchor']='middle'; }
    if (x.bold) a['font-weight']='bold';
    const t = el('text',a); t.textContent = x.t; texts.appendChild(t);
  });
  svg.appendChild(texts);

  // カーソル
  const cu = el('rect',{x:x0+ui.cur.c*CW, y:y0+ui.cur.r*RH, width:CW, height:RH, 'class':'guide',
    fill:'none', stroke: ui.mode==='input' ? '#12a05a' : '#1a6fd4', 'stroke-width':0.45});
  svg.appendChild(cu);

  // 用紙の縁
  svg.appendChild(el('rect',{x:0.1,y:0.1,width:p.w-0.2,height:p.h-0.2,'class':'guide',
    fill:'none',stroke:'#c9d2db','stroke-width':0.2}));

  drawStatus();
  updateInsertLabels();
  $('#title-input').value = doc.paper.title;
}

function drawStatus(){
  const t = scoreTotals(doc);
  const s = $('#status');
  s.innerHTML = '';
  const chip = (txt, cls) => { const d2=document.createElement('span'); d2.className='chip'+(cls?' '+cls:''); d2.textContent=txt; s.appendChild(d2); };
  chip('用紙：A4 '+(doc.paper.orientation==='landscape'?'横':'縦')+' ／ '+doc.grid.cols+'列 × '+doc.grid.rows+'行 ／ 余白'+doc.paper.marginX+'mm・'+doc.paper.marginY+'mm');
  chip('カーソル：'+(ui.cur.c+1)+'列 '+(ui.cur.r+1)+'行');
  chip('欄：'+doc.fields.length+'個');
  const selN = selectedCells().length;
  if (selN > 1) chip('選択中：'+selN+'セル');
  if (doc.fields.length === 0) chip('配点：未設定');
  else if (t['合計'] === 100) chip('配点：合計100（知技'+t['知技']+'／思判表'+t['思判表']+'）');
  else chip('配点：合計'+t['合計']+'（100になっていません）','warn');
  chip('1枚に収まっています');
}

// 印刷時の用紙サイズを常に用紙の向きに合わせておく
function setPageRule(orientation){
  let st = document.getElementById('page-rule');
  if (!st){ st = document.createElement('style'); st.id = 'page-rule'; document.head.appendChild(st); }
  const want = '@page{size:A4 '+(orientation==='landscape'?'landscape':'portrait')+';margin:0}';
  if (st.textContent !== want) st.textContent = want;
}

// 用紙の表示の大きさ。ui.zoom が 0 なら画面に収まる大きさ
function fitPreview(p){
  const pane = document.getElementById('preview');
  const availW = pane.clientWidth - 36;
  const availH = pane.clientHeight - 60;
  if (availW <= 0 || availH <= 0) return;
  const fitW = Math.min(availW, availH * p.w / p.h, 1180);
  const w = ui.zoom ? fitW * ui.zoom : fitW;
  document.getElementById('paper').style.width = Math.max(240, Math.floor(w)) + 'px';
  const z = document.getElementById('zoom-label');
  if (z) z.textContent = ui.zoom ? Math.round(ui.zoom*100)+'%' : '画面に合わせる';
}
window.addEventListener('resize', ()=>{ if (doc) fitPreview(PAGE[doc.paper.orientation]); });

const ZOOMS = [0.6,0.75,0.9,1,1.25,1.5,2,2.5,3];
function setZoom(dir){
  if (dir === 0){ ui.zoom = 0; }
  else {
    const cur = ui.zoom || 1;
    const i = ZOOMS.findIndex(z => z > cur + 0.001);
    if (dir > 0) ui.zoom = ZOOMS[i < 0 ? ZOOMS.length-1 : i];
    else {
      const j = [...ZOOMS].reverse().find(z => z < cur - 0.001);
      ui.zoom = j || ZOOMS[0];
    }
  }
  fitPreview(PAGE[doc.paper.orientation]);
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 1900);
}

/* 画面座標 → セル */
function pointToCell(ev){
  const r = svg.getBoundingClientRect();
  const p = PAGE[doc.paper.orientation];
  const mx = (ev.clientX - r.left) / r.width  * p.w;
  const my = (ev.clientY - r.top ) / r.height * p.h;
  const c = Math.floor((mx - geo.x0)/CW), rr = Math.floor((my - geo.y0)/RH);
  if (c<0||rr<0||c>=doc.grid.cols||rr>=doc.grid.rows) return null;
  return {c, r:rr};
}

/* ---------------------------------------------------------------
   9. 欄を置く
   --------------------------------------------------------------- */
function occupied(d){
  const set = new Set(ui.reserved);
  d.fields.forEach(f => fieldFootprint(d,f).forEach(([c,r]) => set.add(c+','+r)));
  return set;
}

async function placeField(type){
  if (type === 1) return simpleFrame();          // シンプル枠は枠だけ引く
  if (ui.tab !== 'sheet') return toast('模範解答タブでは欄を置けません。解答用紙タブに切り替えてください');
  const vertical = doc.paper.writing==='vertical';
  const opt = {};

  if (type===3){
    const v = await ask('記述の解答欄', [
      {key:'n',label:'字数',type:'number',value:50,min:1},
      {key:'mode',label:'条件',type:'seg',value:'within',options:[['within','以内（8割ライン）'],['exact','ちょうど']]}
    ]); if(!v) return; opt.n=+v.n; opt.exact = (v.mode==='exact');
  }
  if (type===4){
    const v = await ask('長方形の解答欄', [
      {key:'tate',label:'縦（マス）',type:'number',value:3,min:1},
      {key:'yoko',label:'横（マス）',type:'number',value:4,min:1}
    ]); if(!v) return; opt.tate=+v.tate; opt.yoko=+v.yoko;
  }
  if (type===5){
    const v = await ask('xyグラフ', [
      {key:'w',label:'横（マス）',type:'number',value:8,min:2},
      {key:'h',label:'縦（マス）',type:'number',value:8,min:2,hint:'原点が真ん中に来るよう偶数にそろえます'}
    ]); if(!v) return; opt.w=+v.w; opt.h=+v.h;
  }

  // カーソル位置は「番号欄」。解答欄はその次から始まる（お手本と同じ並び）
  const used = occupied(doc);
  const clash = (r) => {
    if (r.c<0 || r.r<0 || r.c+r.w>doc.grid.cols || r.r+r.h>doc.grid.rows) return true;
    for (let i=0;i<r.w;i++) for (let j=0;j<r.h;j++)
      if (used.has((r.c+i)+','+(r.r+j))) return true;
    return false;
  };
  const tryAt = (at) => {
    const lab = labelRect(doc, at);
    const b = buildRects(doc, type, boxStart(doc, at), opt);
    if (b.error || clash(lab) || b.rects.some(clash)) return null;
    return { at, lab, rects:b.rects };
  };

  let got = tryAt({ c:ui.cur.c, r:ui.cur.r });
  let wrapped = false;
  if (!got){
    // 下に入らないときは、行を開けずに次の行（縦書きは左の列）の頭へ
    const top = contentOrigin(doc);
    got = tryAt(vertical ? { c:ui.cur.c-1, r:top.r } : { c:top.c, r:ui.cur.r+CHAR_ROWS });
    wrapped = !!got;
  }
  if (!got) return toast('⚠ ここには置けません（用紙からはみ出すか、ほかの欄があります）');
  const { lab } = got;
  const built = { rects: got.rects };

  snapshot();
  const f = {
    id:'f'+(uid++), type, rects:built.rects, label:lab,
    chars: (type===3 ? opt.n : 1), exact: !!opt.exact,
    points:0, aspect:'知技', complete:(ui.line==='medium'), note:'', notePos:'end'
  };
  doc.fields.push(f);

  // カーソルを次の番号欄の位置へ進める（欄と欄の間は空けない）
  const last = built.rects[built.rects.length-1];
  const minC = Math.min(...built.rects.map(r=>r.c));
  const top = contentOrigin(doc);
  if (vertical){
    let nr = last.r + last.h, nc = last.c;
    if (nr + 1 + CHAR_ROWS > doc.grid.rows){ nc = minC - 1; nr = top.r; }   // 行を開けずに改行
    ui.cur = { c: Math.max(0,nc), r: nr };
  } else {
    let nc = last.c + last.w, nr = last.r;
    if (nc + 1 >= doc.grid.cols){ nc = top.c; nr = last.r + last.h; }
    ui.cur = { c: Math.min(nc, doc.grid.cols-1), r: Math.min(nr, doc.grid.rows-1) };
  }
  ui.sel = null; ui.extra = [];
  render();
  if (wrapped) toast(vertical ? '下に入らないため、次の行（左の列）に置きました'
                              : '右に入らないため、次の行に置きました');
}

/* シンプル枠：選んだ範囲の外側に罫線を引く（今の線の太さで） */
function simpleFrame(){
  const s = ui.sel || { c:ui.cur.c, r:ui.cur.r, w:1, h:1 };
  snapshot();
  const i = doc.decorations.findIndex(v=>v.c===s.c&&v.r===s.r&&v.w===s.w&&v.h===s.h);
  if (i>=0){ doc.decorations.splice(i,1); toast('枠を外しました'); }
  else {
    // 選択とぴったり重なる欄があれば、その欄の太さを切り替える
    const f = doc.fields.find(f => f.rects.length===1 &&
      f.rects[0].c===s.c && f.rects[0].r===s.r && f.rects[0].w===s.w && f.rects[0].h===s.h);
    if (f){ f.complete = (ui.line==='medium'); toast(f.complete?'この欄を太線にしました':'この欄を普通の線にしました'); }
    else { doc.decorations.push({c:s.c,r:s.r,w:s.w,h:s.h,style:ui.line});
           toast(ui.line==='medium' ? '太い枠を引きました' : '枠を引きました'); }
  }
  render();
}

/* 線の太さを切り替える */
function setLine(kind){
  ui.line = kind;
  document.querySelectorAll('[data-line]').forEach(b=>b.classList.toggle('on', b.dataset.line===kind));
  setModeBar();
  toast(kind==='medium' ? '太線モードにしました' : '普通線モードにしました');
}

/* 挿入：選んだ分だけ空きを作り、続きを押し出す
   縦書き＝同じ列の下へ、横書き＝同じ行の右へ */
function insertCells(){
  const vertical = doc.paper.writing==='vertical';
  const s = ui.sel || { c:ui.cur.c, r:ui.cur.r, w:1, h:1 };
  const n = vertical ? s.h : s.w;                 // 押し出す量
  const lo = vertical ? s.c : s.r;                // 対象の列（行）の範囲
  const hi = vertical ? s.c + s.w - 1 : s.r + s.h - 1;
  const from = vertical ? s.r : s.c;              // ここから先を押し出す
  const limit = vertical ? doc.grid.rows : doc.grid.cols;

  const inRange = (c,r) => vertical ? (c>=lo && c<=hi) : (r>=lo && r<=hi);
  const pos     = (c,r) => vertical ? r : c;
  const moved   = [];                             // 押し出すもの

  // はみ出さないか先に確かめる
  const check = (c,r,w,h) => {
    const end = vertical ? r+h : c+w;
    return end + n <= limit;
  };
  for (const f of doc.fields)
    for (const rc of f.rects)
      if (inRange(rc.c, rc.r) && pos(rc.c, rc.r) >= from && !check(rc.c,rc.r,rc.w,rc.h))
        return toast('⚠ 押し出すと用紙からはみ出します');
  for (const v of doc.decorations)
    if (inRange(v.c, v.r) && pos(v.c, v.r) >= from && !check(v.c,v.r,v.w,v.h))
      return toast('⚠ 押し出すと用紙からはみ出します');
  for (const k in doc.texts){
    const [c,r] = k.split(',').map(Number);
    if (inRange(c,r) && pos(c,r) >= from && pos(c,r)+n >= limit)
      return toast('⚠ 押し出すと用紙からはみ出します');
  }

  snapshot();
  const shift = (o) => { if (vertical) o.r += n; else o.c += n; };
  doc.fields.forEach(f => {
    f.rects.forEach(rc => { if (inRange(rc.c,rc.r) && pos(rc.c,rc.r) >= from) shift(rc); });
    if (f.label && inRange(f.label.c,f.label.r) && pos(f.label.c,f.label.r) >= from) shift(f.label);
  });
  doc.decorations.forEach(v => { if (inRange(v.c,v.r) && pos(v.c,v.r) >= from) shift(v); });
  const nt = {};
  for (const k in doc.texts){
    const [c,r] = k.split(',').map(Number);
    if (inRange(c,r) && pos(c,r) >= from) nt[vertical ? c+','+(r+n) : (c+n)+','+r] = doc.texts[k];
    else nt[k] = doc.texts[k];
  }
  doc.texts = nt;
  render();
  toast(vertical ? n+'行ぶん空けて、下へ押し出しました' : n+'列ぶん空けて、右へ押し出しました');
}

/* 行ごと挿入：縦書きは列を差し込んで左へ、横書きは行を差し込んで下へ押し出す */
function insertLine(){
  const vertical = doc.paper.writing==='vertical';
  const s = ui.sel || { c:ui.cur.c, r:ui.cur.r, w:1, h:1 };
  const n = vertical ? s.w : s.h;                 // 差し込む行（列）の数
  const from = vertical ? s.c : s.r;
  const limit = vertical ? doc.grid.cols : doc.grid.rows;
  const pos = (c,r) => vertical ? c : r;
  const size = (w,h) => vertical ? w : h;

  const over = (c,r,w,h) => pos(c,r) >= from && pos(c,r) + size(w,h) + n > limit;
  for (const f of doc.fields){
    for (const rc of f.rects) if (over(rc.c,rc.r,rc.w,rc.h)) return toast('⚠ 押し出すと用紙からはみ出します');
    if (f.label && over(f.label.c,f.label.r,f.label.w,f.label.h)) return toast('⚠ 押し出すと用紙からはみ出します');
  }
  for (const v of doc.decorations) if (over(v.c,v.r,v.w,v.h)) return toast('⚠ 押し出すと用紙からはみ出します');
  for (const k in doc.texts){
    const [c,r] = k.split(',').map(Number);
    if (pos(c,r) >= from && pos(c,r) + n >= limit) return toast('⚠ 押し出すと用紙からはみ出します');
  }

  snapshot();
  const shift = (o) => { if (vertical) o.c += n; else o.r += n; };
  doc.fields.forEach(f => {
    f.rects.forEach(rc => { if (pos(rc.c,rc.r) >= from) shift(rc); });
    if (f.label && pos(f.label.c,f.label.r) >= from) shift(f.label);
  });
  doc.decorations.forEach(v => { if (pos(v.c,v.r) >= from) shift(v); });
  const nt = {};
  for (const k in doc.texts){
    const [c,r] = k.split(',').map(Number);
    if (pos(c,r) >= from) nt[vertical ? (c+n)+','+r : c+','+(r+n)] = doc.texts[k];
    else nt[k] = doc.texts[k];
  }
  doc.texts = nt;
  render();
  toast(vertical ? n+'列ぶん差し込んで、左へ押し出しました' : n+'行ぶん差し込んで、下へ押し出しました');
}

/* 消す */
function clearSelection(){
  const cells = selectedCells();
  if (!cells.length) return;
  snapshot();
  const keys = new Set(cells.map(p=>p.c+','+p.r));
  if (ui.tab==='answer'){
    // 模範解答タブでは答えだけ消す
    let n=0;
    doc.fields.forEach(f=>{
      if (charCells(doc,f).some(p=>keys.has(p.c+','+p.r)) && doc.answers[f.id]){ delete doc.answers[f.id]; n++; }
    });
    render(); return toast(n?'答えを消しました':'消すものがありません');
  }
  const before = doc.fields.length;
  doc.fields = doc.fields.filter(f => !fieldFootprint(doc,f).some(([c,r])=>keys.has(c+','+r)));
  doc.decorations = doc.decorations.filter(v=>{
    for(let i=0;i<v.w;i++) for(let j=0;j<v.h;j++) if(keys.has((v.c+i)+','+(v.r+j))) return false;
    return true;
  });
  keys.forEach(k=>{ delete doc.texts[k]; });
  render();
  toast(before!==doc.fields.length ? '欄を消しました' : '消しました');
}

// 対象のセル：範囲選択と「離れた選択」を優先し、どちらも無ければカーソルの1マス
function selectedCells(){
  const out = [];
  if (ui.sel)
    for (let j=0;j<ui.sel.h;j++) for (let i=0;i<ui.sel.w;i++) out.push({c:ui.sel.c+i, r:ui.sel.r+j});
  ui.extra.forEach(p=>{ if(!out.some(q=>q.c===p.c&&q.r===p.r)) out.push(p); });
  if (!out.length) out.push({c:ui.cur.c, r:ui.cur.r});
  return out;
}

// 罫線と文字をすべて消す（タイトル・氏名欄・得点枠は残る）
async function clearAll(){
  if (!doc.fields.length && !doc.decorations.length && !Object.keys(doc.texts).length
      && !Object.keys(doc.answers).length)
    return toast('消すものがありません');
  const v = await ask('解答欄をすべて消しますか', [
    {key:'ok', label:'', type:'none',
     hint:'罫線と入力した文字、模範解答をすべて消します。\n'+
          'テストのタイトル・氏名欄・得点枠は残ります。\n\n'+
          'Ctrl+Z で元に戻せます。'}
  ]);
  if (!v) return;
  snapshot();
  doc.fields = []; doc.decorations = []; doc.texts = {}; doc.answers = {};
  ui.cur = Object.assign({}, contentOrigin(doc));
  ui.sel = null; ui.extra = [];
  render();
  toast('すべて消しました（Ctrl+Z で戻せます）');
}

/* ---------------------------------------------------------------
   10. 番号スタンプ（選んだセルに順番に振る。自動判断はしない）
   --------------------------------------------------------------- */
const STAMPS = {
  D:{ name:'大問',   fmt:(n,st)=> st==='kanji'? kanji(n) : String(n), size:14, bold:true },
  Q:{ name:'問番号', fmt:(n,st)=> '問'+(st==='kanji'? kanji(n) : String(n)), size:11 },
  P:{ name:'(1)',    fmt:(n)=> '('+n+')', size:11 },
  M:{ name:'①',      fmt:(n)=> maru(n), size:14 },
  A:{ name:'ア',      fmt:(n)=> kana(n), size:14 }
};

async function stamp(key){
  if (ui.tab !== 'sheet') return toast('模範解答タブでは番号を振れません');
  const def = STAMPS[key];
  let cells = selectedCells();
  if (!cells.length) return;

  // 選んだ範囲に「番号欄」が含まれていれば、そこだけに振る。
  // （欄をまとめて選んでも、解答欄のマスには番号が入らない）
  const labels = new Set();
  doc.fields.forEach(f => { if (f.label) labels.add(f.label.c+','+f.label.r); });
  const onLabels = cells.filter(p => labels.has(p.c+','+p.r));
  const usedLabels = onLabels.length > 0;
  if (usedLabels) cells = onLabels;
  else {
    // 解答欄の中には振らない
    const inside = new Set();
    doc.fields.forEach(f => f.rects.forEach(r => {
      for (let i=0;i<r.w;i++) for (let j=0;j<r.h;j++) inside.add((r.c+i)+','+(r.r+j));
    }));
    const outside = cells.filter(p => !inside.has(p.c+','+p.r));
    if (outside.length) cells = outside;
  }

  const v = await ask(def.name+'を振ります（'+cells.length+'か所）',
    [{key:'start',label:'開始番号',type:'number',value:1,min:1}]);
  if (!v) return;
  const start = Math.max(1, +v.start||1);
  // 読む順に並べ替える（縦書きは右の列から、各列は上から）
  const vertical = doc.paper.writing==='vertical';
  cells.sort((a,b)=> vertical ? (b.c-a.c)||(a.r-b.r) : (a.r-b.r)||(a.c-b.c));
  snapshot();
  cells.forEach((p,i)=>{
    doc.texts[p.c+','+p.r] = { t:def.fmt(start+i, doc.paper.numberStyle),
      size:def.size, bold:!!def.bold, box:!labels.has(p.c+','+p.r) };
  });
  render();                       // 選んだ範囲はそのまま残す
  toast(def.name+'を'+cells.length+'か所に振りました'+(usedLabels?'（番号欄だけ）':''));
}

/* ---------------------------------------------------------------
   11. 入力モード（ここだけ日本語入力が使える）
   --------------------------------------------------------------- */
async function enterInput(){
  const inp = $('#cell-input');
  const many = selectedCells();

  // 解答用紙タブで欄の上にいるなら、「欄に入れる文字」を位置つきで入れる
  if (ui.tab==='sheet' && many.length===1){
    const f = fieldAt(ui.cur.c, ui.cur.r);
    const onBox = f && f.rects.some(x => ui.cur.c>=x.c && ui.cur.c<x.c+x.w && ui.cur.r>=x.r && ui.cur.r<x.r+x.h);
    if (onBox){
      const v = await ask('解答欄に文字を入れる', [
        {key:'note',label:'文字',type:'text',value:f.note||'',hint:'例：から。　x＝　cm²'},
        {key:'pos',label:'位置',type:'seg',value:f.notePos||'end',
         options:[['start','先頭'],['center','中央'],['end','お尻']]}
      ]);
      if (!v) return;
      snapshot();
      f.note = v.note || ''; f.notePos = v.pos || 'end';
      render();
      return toast(f.note ? '解答欄に文字を入れました' : '解答欄の文字を消しました');
    }
  }
  // 範囲を選んでいるときは、同じ文字を選んだマスすべてに入れる
  if (many.length > 1){
    const v = await ask('選んだ'+many.length+'マスすべてに同じ文字を入れます',
      [{key:'t',label:'文字',type:'text',value:''}]);
    if (!v) return;
    snapshot();
    many.forEach(p => {
      if (v.t) doc.texts[p.c+','+p.r] = { t:v.t, size:11 };
      else delete doc.texts[p.c+','+p.r];
    });
    render();
    return toast(v.t ? many.length+'マスに入れました' : many.length+'マスの文字を消しました');
  }

  if (ui.tab==='answer'){
    const f = fieldAt(ui.cur.c, ui.cur.r);
    if (!f) return toast('答えを入れる欄の上でEnterを押してください');
    ui.editTarget = { kind:'answer', field:f };
    inp.value = doc.answers[f.id] || '';
    inp.placeholder = FIELD_DEFS[f.type].name+'の答え';
  } else {
    ui.editTarget = { kind:'cell', c:ui.cur.c, r:ui.cur.r };
    const cur = doc.texts[ui.cur.c+','+ui.cur.r];
    inp.value = cur ? cur.t : '';
    inp.placeholder = '文字（1マスに1文字ずつ並びます）';
  }
  ui.mode = 'input';
  const rect = svg.getBoundingClientRect(), p = PAGE[doc.paper.orientation];
  const sx = rect.width/p.w, sy = rect.height/p.h;
  inp.style.display = 'block';
  inp.style.left = (rect.left + window.scrollX + (geo.x0 + ui.cur.c*CW)*sx) + 'px';
  inp.style.top  = (rect.top  + window.scrollY + (geo.y0 + ui.cur.r*RH)*sy + 20) + 'px';
  inp.focus(); inp.select();
  setModeBar();
  render();
}

function commitInput(){
  const inp = $('#cell-input');
  const val = inp.value;
  const t = ui.editTarget;
  if (t){
    snapshot();
    if (t.kind==='answer') {
      if (val) doc.answers[t.field.id] = val; else delete doc.answers[t.field.id];
    } else {
      // 1マス1文字で書き方向に並べる
      const vertical = doc.paper.writing==='vertical';
      delete doc.texts[t.c+','+t.r];
      for (let i=0;i<val.length;i++){
        const c = vertical ? t.c : t.c + i;
        const r = vertical ? t.r + i*CHAR_ROWS : t.r;
        if (c>=doc.grid.cols || r>=doc.grid.rows) break;
        doc.texts[c+','+r] = { t: val[i], size:11 };
      }
    }
  }
  exitInput();
}
function exitInput(){
  const inp = $('#cell-input');
  inp.style.display='none'; inp.value='';
  ui.mode='place'; ui.editTarget=null;
  setModeBar();
  document.body.focus();
  render();
}
function setModeBar(){
  const b = $('#modebar');
  if (ui.mode==='input'){
    b.className='input';
    b.textContent='🟩 入力モード ─ 日本語入力が使えます（Enter で確定 ／ Esc で取り消し）';
  } else {
    b.className='place';
    b.textContent='🟦 置くモード ─ 罫線は'+(ui.line==='medium'?'太線':'普通線')
      +'（Shift+1 普通線 ／ Shift+2 太線）　キーは命令として働きます（文字を入れるには Enter）';
  }
}
// その位置にある欄（番号欄の上でも見つかる）
function fieldAt(c,r){
  const hit = x => c>=x.c && c<x.c+x.w && r>=x.r && r<x.r+x.h;
  return doc.fields.find(f => f.rects.some(hit) || (f.label && hit(f.label)));
}

/* ---------------------------------------------------------------
   12. キーボード
   置くモードでは文字入力欄にフォーカスを置かないので、日本語入力が
   ONでもキーは命令として届く。判定は e.code で行う。
   --------------------------------------------------------------- */
const CODE_FIELD = {Digit1:1,Digit2:2,Digit3:3,Digit4:4,Digit5:5,
                    Numpad1:1,Numpad2:2,Numpad3:3,Numpad4:4,Numpad5:5};
const CODE_STAMP = {KeyD:'D',KeyQ:'Q',KeyP:'P',KeyM:'M',KeyA:'A'};

document.addEventListener('keydown', ev => {
  if ($('#start').style.display !== 'none') return;         // 起動画面では何もしない
  if (document.querySelector('.modal')) return;             // モーダルは各自で処理
  if (ev.isComposing || ev.keyCode === 229) return;         // 日本語変換中は無視

  // --- 入力モード：Enter と Esc 以外は文字として通す ---
  if (ui.mode === 'input'){
    if (ev.key === 'Enter'){ ev.preventDefault(); commitInput(); }
    else if (ev.key === 'Escape'){ ev.preventDefault(); exitInput(); }
    return;
  }

  // --- 置くモード ---
  const ctrl = ev.ctrlKey || ev.metaKey;
  if (ctrl){
    if (ev.code==='KeyZ' && !ev.shiftKey){ ev.preventDefault(); return undo(); }
    if ((ev.code==='KeyZ' && ev.shiftKey) || ev.code==='KeyY'){ ev.preventDefault(); return redo(); }
    return;                                                  // 他の Ctrl 系はブラウザに任せる
  }
  if (ev.altKey) return;

  // 移動と選択
  const MOVE = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  if (MOVE[ev.key]){
    ev.preventDefault();
    const [dc,dr] = MOVE[ev.key];
    const nc = Math.min(doc.grid.cols-1, Math.max(0, ui.cur.c+dc));
    const nr = Math.min(doc.grid.rows-1, Math.max(0, ui.cur.r+dr));
    if (ev.shiftKey){
      const a = ui.selAnchor || {c:ui.cur.c, r:ui.cur.r};
      ui.selAnchor = a;
      ui.cur = {c:nc, r:nr};
      ui.sel = { c:Math.min(a.c,nc), r:Math.min(a.r,nr),
                 w:Math.abs(a.c-nc)+1, h:Math.abs(a.r-nr)+1 };
    } else { ui.cur = {c:nc,r:nr}; ui.sel=null; ui.selAnchor=null; }   // 離れた選択は残す
    render(); return;
  }

  if (ev.key === 'Enter' || ev.key === 'F2'){ ev.preventDefault(); return enterInput(); }
  if (ev.key === 'Escape'){ ev.preventDefault(); ui.sel=null; ui.extra=[]; ui.selAnchor=null; render(); return; }
  if (ev.key === 'Delete' || ev.key === 'Backspace'){ ev.preventDefault(); return clearSelection(); }
  if (ev.key === ' ' && ev.shiftKey){          // 離れたセルを選択に足す／外す
    ev.preventDefault();
    const i = ui.extra.findIndex(q => q.c===ui.cur.c && q.r===ui.cur.r);
    if (i>=0) ui.extra.splice(i,1); else ui.extra.push({c:ui.cur.c, r:ui.cur.r});
    render();
    toast(ui.extra.length ? '選んだセル：'+ui.extra.length+'か所（番号を振るキーを押してください）' : '選択を外しました');
    return;
  }
  if (ev.key === ' '){ ev.preventDefault(); return openFieldPopup(); }
  if (ev.key === 'Tab'){ ev.preventDefault(); return; }

  if (CODE_FIELD[ev.code]){
    ev.preventDefault();
    const n = CODE_FIELD[ev.code];
    if (ev.shiftKey){                              // Shift+1 普通線 / Shift+2 太線
      if (n===1) return setLine('thin');
      if (n===2) return setLine('medium');
      return;
    }
    return placeField(n);
  }
  if (CODE_STAMP[ev.code]){ ev.preventDefault(); return stamp(CODE_STAMP[ev.code]); }
  if (ev.code === 'KeyI'){ ev.preventDefault(); return ev.shiftKey ? insertLine() : insertCells(); }
  if (ev.code === 'Minus'){ ev.preventDefault(); return setZoom(-1); }
  if (ev.code === 'Equal' || ev.code === 'Semicolon'){ ev.preventDefault(); return setZoom(1); }
  if (ev.code === 'Digit0'){ ev.preventDefault(); return setZoom(0); }

  // 命令に当てはまらない文字キー → 入力モードの案内を出す
  if (ev.key.length === 1 && !ctrl){ ev.preventDefault(); toast('文字を入れるには Enter'); }
});

/* クリック操作 */
svg.addEventListener('mousedown', ev => {
  if (ui.mode==='input') commitInput();
  const p = pointToCell(ev); if (!p) return;
  if (ev.ctrlKey || ev.metaKey){
    const i = ui.extra.findIndex(q=>q.c===p.c&&q.r===p.r);
    if (i>=0) ui.extra.splice(i,1); else ui.extra.push(p);
    render(); return;
  }
  if (ev.shiftKey){
    const a = {c:ui.cur.c, r:ui.cur.r};
    ui.sel = { c:Math.min(a.c,p.c), r:Math.min(a.r,p.r), w:Math.abs(a.c-p.c)+1, h:Math.abs(a.r-p.r)+1 };
    ui.selAnchor = a; render(); return;
  }
  ui.cur = p; ui.sel = null; ui.extra=[]; ui.selAnchor = p;
  dragging = true; render();
});
let dragging = false;
svg.addEventListener('mousemove', ev => {
  if (!dragging) return;
  const p = pointToCell(ev); if (!p) return;
  const a = ui.selAnchor;
  ui.sel = { c:Math.min(a.c,p.c), r:Math.min(a.r,p.r), w:Math.abs(a.c-p.c)+1, h:Math.abs(a.r-p.r)+1 };
  if (ui.sel.w===1 && ui.sel.h===1) ui.sel = null;
  render();
});
document.addEventListener('mouseup', ()=>{ dragging=false; });
svg.addEventListener('dblclick', ev => { const p=pointToCell(ev); if(p){ ui.cur=p; enterInput(); } });

$('#cell-input').addEventListener('blur', ()=>{ if (ui.mode==='input') commitInput(); });

/* ---------------------------------------------------------------
   13. 欄の設定（Space またはクリック後の小窓）

async function openFieldPopup(){
  const f = fieldAt(ui.cur.c, ui.cur.r);
  if (!f) return toast('欄の上にカーソルを置いて Space を押してください');
  const rows = [
    {key:'points',label:'配点',type:'number',value:f.points,min:0},
    {key:'aspect',label:'観点',type:'seg',value:f.aspect,options:[['知技','知・技'],['思判表','思・判・表']]},
    {key:'complete',label:'完答（太枠）',type:'check',value:f.complete}
  ];
  if (f.type===3) rows.push({key:'exact',label:'8割ライン',type:'check',value:!f.exact});
  rows.push({key:'note',label:'欄に入れる文字',type:'text',value:f.note||'',hint:'例：から。　x＝　cm²'});
  rows.push({key:'notePos',label:'その位置',type:'seg',value:f.notePos||'end',
             options:[['start','先頭'],['center','中央'],['end','お尻']]});
  const v = await ask(FIELD_DEFS[f.type].name+'の設定', rows);
  if (!v) return;
  snapshot();
  f.points = Math.max(0, +v.points||0);
  f.aspect = v.aspect;
  f.complete = !!v.complete;
  if (f.type===3) f.exact = !v.exact;
  const total = charCells(doc, f).length;
  const note = v.note || '';
  if (note.length >= total && note.length)
    toast('⚠ 文字が欄いっぱいで、答えを書く場所が残りません。欄を大きくしてください');
  else { f.note = note; f.notePos = v.notePos || 'end'; }
  render();
}

/* ---------------------------------------------------------------
   14. ZIP（無圧縮・格納のみ）
   xlsx は ZIP。外部ライブラリを使わず、必要最小限を自前で書き出す。
   --------------------------------------------------------------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n=0;n<256;n++){
    let c = n;
    for (let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;

  for (const f of files){
    const name = enc.encode(f.name);
    const data = enc.encode(f.data);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);      // UTF-8 ファイル名
    lh.setUint16(8, 0, true);           // 無圧縮
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  let cdSize = 0; central.forEach(p => cdSize += p.length);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true);
  const all = parts.concat(central, [new Uint8Array(eo.buffer)]);
  let total = 0; all.forEach(p => total += p.length);
  const out = new Uint8Array(total);
  let pos = 0; all.forEach(p => { out.set(p, pos); pos += p.length; });
  return out;
}

/* ---------------------------------------------------------------
   15. Excel 出力（正本）
   セル罫線とセル文字だけ。図形なし・結合なし・縦書きセルなし。
   --------------------------------------------------------------- */
const xmlEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
function colName(i){                    // 0 → A
  let s = '';
  i++;
  while (i>0){ const m = (i-1)%26; s = String.fromCharCode(65+m)+s; i = (i-1-m)/26; }
  return s;
}

function buildXlsx(){
  const sheets = [
    { name:'解答用紙', cells: buildCells(doc, false) },
    { name:'模範解答', cells: buildCells(doc, true)  }
  ];
  // スタイル表を作る（フォント・罫線・配置の組み合わせを重複なく集める）
  const fonts = [], borders = [], xfs = [];
  const fontKey = new Map(), borderKey = new Map(), xfKey = new Map();
  const addFont = (sz,bold) => {
    const k = sz+'/'+bold;
    if (!fontKey.has(k)){ fontKey.set(k, fonts.length); fonts.push({sz,bold}); }
    return fontKey.get(k);
  };
  const addBorder = b => {
    const k = (b.left||'')+'|'+(b.right||'')+'|'+(b.top||'')+'|'+(b.bottom||'');
    if (!borderKey.has(k)){ borderKey.set(k, borders.length); borders.push(b); }
    return borderKey.get(k);
  };
  const addXf = (fi,bi,align) => {
    const k = fi+'/'+bi+'/'+align;
    if (!xfKey.has(k)){ xfKey.set(k, xfs.length); xfs.push({fi,bi,align}); }
    return xfKey.get(k);
  };
  addFont(11,false); addBorder({});    // 既定
  addXf(0,0,'center');

  const sheetXml = sheets.map(sh => {
    const { cols, rows } = doc.grid;
    const merges = [];
    let body = '';
    for (let r=0;r<rows;r++){
      let rowXml = '';
      for (let c=0;c<cols;c++){
        const x = sh.cells.get(c+','+r);
        if (!x || (!x.t && !x.b.top && !x.b.bottom && !x.b.left && !x.b.right)) continue;
        const si = addXf(addFont(x.size||11, x.bold), addBorder(x.b), x.align||'center');
        const ref = colName(c)+(r+1);
        if (x.mid) merges.push(ref+':'+colName(c)+(r+2));   // 1文字マスの2行を結合
        rowXml += x.t
          ? '<c r="'+ref+'" s="'+si+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(x.t)+'</t></is></c>'
          : '<c r="'+ref+'" s="'+si+'"/>';
      }
      body += '<row r="'+(r+1)+'" ht="'+ROW_H_PT+'" customHeight="1" spans="1:'+cols+'">'+rowXml+'</row>';
    }
    const mx = (doc.paper.marginX/25.4).toFixed(6), my = (doc.paper.marginY/25.4).toFixed(6);
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<dimension ref="A1:'+colName(cols-1)+rows+'"/>'+
      '<sheetViews><sheetView workbookViewId="0"/></sheetViews>'+
      '<sheetFormatPr defaultColWidth="'+COL_W_EXCEL+'" defaultRowHeight="'+ROW_H_PT+'" customHeight="1"/>'+
      '<cols><col min="1" max="'+cols+'" width="'+COL_W_EXCEL+'" customWidth="1"/></cols>'+
      '<sheetData>'+body+'</sheetData>'+
      (merges.length ? '<mergeCells count="'+merges.length+'">'+
        merges.map(m=>'<mergeCell ref="'+m+'"/>').join('')+'</mergeCells>' : '')+
      '<printOptions horizontalCentered="1" verticalCentered="1"/>'+
      '<pageMargins left="'+mx+'" right="'+mx+'" top="'+my+'" bottom="'+my+'" header="0" footer="0"/>'+
      '<pageSetup paperSize="9" scale="'+Math.round(SCALE*100)+'" orientation="'+doc.paper.orientation+'"/>'+
      '</worksheet>';
  });

  const fontsXml = '<fonts count="'+fonts.length+'">'+fonts.map(f =>
    '<font>'+(f.bold?'<b/>':'')+'<sz val="'+f.sz+'"/><color rgb="FF000000"/><name val="游ゴシック"/><family val="3"/><charset val="128"/></font>'
  ).join('')+'</fonts>';
  const bordersXml = '<borders count="'+borders.length+'">'+borders.map(b => {
    const s = (side,key) => b[key] ? '<'+side+' style="'+b[key]+'"><color rgb="FF000000"/></'+side+'>' : '<'+side+'/>';
    return '<border>'+s('left','left')+s('right','right')+s('top','top')+s('bottom','bottom')+'<diagonal/></border>';
  }).join('')+'</borders>';
  const xfsXml = '<cellXfs count="'+xfs.length+'">'+xfs.map(x =>
    '<xf numFmtId="0" fontId="'+x.fi+'" fillId="0" borderId="'+x.bi+'" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1">'+
    '<alignment horizontal="'+(x.align==='left'?'left':'center')+'" vertical="center"/></xf>'
  ).join('')+'</cellXfs>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    fontsXml+
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'+
    bordersXml+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    xfsXml+
    '<cellStyles count="1"><cellStyle name="標準" xfId="0" builtinId="0"/></cellStyles>'+
    '</styleSheet>';

  const lastRef = '$'+colName(doc.grid.cols-1)+'$'+doc.grid.rows;
  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets>'+sheets.map((s,i)=>'<sheet name="'+xmlEsc(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets>'+
    '<definedNames>'+sheets.map((s,i)=>
      '<definedName name="_xlnm.Print_Area" localSheetId="'+i+'">'+xmlEsc(s.name)+'!$A$1:'+lastRef+'</definedName>').join('')+
    '</definedNames></workbook>';

  const files = [
    { name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      '</Types>' },
    { name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>' },
    { name:'xl/workbook.xml', data:workbook },
    { name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
      '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '</Relationships>' },
    { name:'xl/styles.xml', data:styles }
  ];
  sheets.forEach((s,i)=> files.push({ name:'xl/worksheets/sheet'+(i+1)+'.xml', data:sheetXml[i] }));
  return zipStore(files);
}

function baseName(){
  const d2 = new Date();
  const ymd = d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
  return doc.paper.subject+'_'+doc.paper.grade+'年_'+ymd;
}
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ファイルに書き出す。
   ブラウザで直接HTMLを開くとダウンロード名が失われることがあるため、
   使える環境では保存ダイアログを出し、そうでなければファイル名を画面で知らせる。 */
// 枠の中（公開ページ）で表示されているか
const inFrame = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();

// 公開ページでファイルを渡す仕組み。手元のファイルとして開いたときは使わない。
let saveCap;                       // undefined=未確認 / null=使えない
async function viewerSave(){
  if (saveCap !== undefined) return saveCap;
  try { saveCap = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }
  catch(e){ saveCap = null; }
  return saveCap;
}

async function saveBytes(data, name, mime, accept){
  const viewer = await viewerSave();
  if (viewer){
    try {
      await viewer.save({ filename:name,
        data: (typeof data === 'string') ? data : new Blob([data], {type:mime}) });
      return 'picker';
    } catch(e){
      if (e && e.code === 'declined') return 'cancel';
      return 'blocked';
    }
  }
  if (inFrame) return 'blocked';
  if (window.showSaveFilePicker){
    try{
      const h = await window.showSaveFilePicker({ suggestedName:name, types:[{description:name, accept}] });
      const w = await h.createWritable();
      await w.write(data); await w.close();
      return 'picker';
    } catch(e){
      if (e && e.name === 'AbortError') return 'cancel';
    }
  }
  download(new Blob([data], {type:mime}), name);
  return 'download';
}

async function exportXlsx(){
  const name = '解答用紙_'+baseName()+'.xlsx';
  const how = await saveBytes(buildXlsx(), name,
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    {'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']});
  if (how === 'cancel') return;
  if (how === 'blocked') return noSaveHere('Excel');
  toast(how==='picker'
    ? 'Excelを保存しました（解答用紙・模範解答の2シート）'
    : 'Excelを書き出しました。ファイル名は「'+name+'」です');
}

const BK_KEY = 'answer-sheet-maker/backup';
const OPT_KEY = 'answer-sheet-maker/options';
let options = { backupAnswers:false, clearOnExit:false };
try { const o = localStorage.getItem(OPT_KEY); if (o) options = Object.assign(options, JSON.parse(o)); } catch(e){}
const saveOptions = () => { try{ localStorage.setItem(OPT_KEY, JSON.stringify(options)); }catch(e){} };

let fileHandle = null;   // 上書き保存用（対応ブラウザのみ）

function docJson(forBackup){
  const copy = JSON.parse(JSON.stringify(doc));
  if (forBackup && !options.backupAnswers) copy.answers = {};
  return JSON.stringify(copy);
}
function backup(){
  try { localStorage.setItem(BK_KEY, docJson(true)); } catch(e){}
}
async function saveWork(){
  const name = baseName()+'.json';
  const text = docJson(false);
  const viewer = await viewerSave();
  if (viewer || inFrame){
    const how = await saveBytes(text, name, 'application/json', {'application/json':['.json']});
    if (how === 'cancel') return;
    if (how === 'blocked') return noSaveHere('作業ファイル');
    ui.dirty = false;
    return toast('作業ファイルを保存しました');
  }
  if (window.showSaveFilePicker && fileHandle){
    try{                                   // 2回目からは上書き保存
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      ui.dirty = false; return toast('上書き保存しました');
    } catch(e){ fileHandle = null; }
  }
  if (window.showSaveFilePicker){
    try{
      fileHandle = await window.showSaveFilePicker({ suggestedName:name,
        types:[{description:'解答用紙メーカーの作業ファイル', accept:{'application/json':['.json']}}] });
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      ui.dirty = false; return toast('保存しました（次からは上書き保存になります）');
    } catch(e){
      fileHandle = null;
      if (e && e.name==='AbortError') return;
    }
  }
  download(new Blob([text],{type:'application/json'}), name);
  ui.dirty = false;
  toast('作業ファイルを書き出しました。ファイル名は「'+name+'」です');
}
// お試し用の画面ではファイルを保存できない旨を伝える
function noSaveHere(what){
  return ask('この画面では'+what+'を保存できません', [
    {key:'ok', label:'', type:'none',
     hint:'ここは操作を試すための画面です。'+what+'の保存はこの画面からはできません。\n\n'+
          '実際に使うときは answer-sheet-maker.html をパソコンに保存して、'+
          'ダブルクリックで開いてください。すべての機能が動きます。'}
  ]);
}

function loadWork(text){
  const d = JSON.parse(text);
  if (!d || !d.paper || !d.grid) throw new Error('形式が違います');
  doc = d;
  doc.grid = computeGrid(doc.paper);            // 余白設定に合わせ直す
  uid = 1; doc.fields.forEach(f => { const n = +String(f.id).replace('f',''); if (n>=uid) uid = n+1; });
  history.sheet = {undo:[],redo:[]}; history.answer = {undo:[],redo:[]};
  startApp();
}

/* ---------------------------------------------------------------
   17. モーダル（小窓）
   --------------------------------------------------------------- */
function ask(title, rows){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    const vals = {};
    let html = '<div class="card"><h3>'+xmlEsc(title)+'</h3>';
    rows.forEach((f,i) => {
      vals[f.key] = f.value;
      html += '<div class="row">'+(f.label ? '<label>'+xmlEsc(f.label)+'</label>' : '');
      if (f.type==='none') html += '';
      else if (f.type==='number') html += '<input type="number" data-k="'+f.key+'" value="'+f.value+'" min="'+(f.min||0)+'" '+(i===0?'autofocus':'')+'>';
      else if (f.type==='text') html += '<input type="text" data-k="'+f.key+'" value="'+xmlEsc(f.value||'')+'">';
      else if (f.type==='check') html += '<input type="checkbox" data-k="'+f.key+'" '+(f.value?'checked':'')+' style="flex:none;width:18px;height:18px">';
      else if (f.type==='seg'){
        html += '<div class="seg" data-k="'+f.key+'">'+f.options.map(o =>
          '<button type="button" data-v="'+o[0]+'" class="'+(o[0]===f.value?'on':'')+'">'+xmlEsc(o[1])+'</button>').join('')+'</div>';
      }
      if (f.hint) html += '<div class="hint"'+(f.label ? '' :
        ' style="margin-left:0;white-space:pre-line;font-size:13px;line-height:1.9"')+'>'+xmlEsc(f.hint)+'</div>';
      html += '</div>';
    });
    html += '<div class="modal-actions"><button class="tb" data-act="cancel">やめる</button>'+
            '<button class="tb primary" data-act="ok">決定<kbd>Enter</kbd></button></div></div>';
    wrap.innerHTML = html;
    document.body.appendChild(wrap);

    wrap.querySelectorAll('.seg').forEach(seg => {
      seg.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
        b.classList.add('on'); vals[seg.dataset.k] = b.dataset.v;
      });
    });
    const close = (ok) => {
      if (ok) wrap.querySelectorAll('input[data-k]').forEach(inp => {
        vals[inp.dataset.k] = (inp.type==='checkbox') ? inp.checked : inp.value;
      });
      wrap.remove();
      document.body.focus();
      resolve(ok ? vals : null);
    };
    wrap.addEventListener('click', e => {
      const b = e.target.closest('button[data-act]');
      if (b) close(b.dataset.act==='ok');
      else if (e.target===wrap) close(false);
    });
    wrap.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.isComposing || e.keyCode===229) return;
      if (e.key==='Enter'){ e.preventDefault(); close(true); }
      if (e.key==='Escape'){ e.preventDefault(); close(false); }
    });
    // 入力欄が無い小窓（説明だけのもの）は決定ボタンに合わせる
    const first = wrap.querySelector('input') || wrap.querySelector('[data-act="ok"]');
    if (first){ first.focus(); if (first.select) first.select(); }
  });
}

async function openSettings(){
  const p = doc.paper;
  const v = await ask('用紙と表示の設定', [
    {key:'grade',label:'学年',type:'text',value:p.grade,hint:'例：一／1'},
    {key:'term',label:'学期',type:'text',value:p.term,hint:'例：２学期中間（空欄でも可）'},
    {key:'testName',label:'テスト名',type:'text',value:p.testName,hint:'例：学年末テスト'},
    {key:'writing',label:'文字の向き',type:'seg',value:p.writing,options:[['vertical','縦書き'],['horizontal','横書き']]},
    {key:'orientation',label:'用紙の向き',type:'seg',value:p.orientation,options:[['landscape','A4横'],['portrait','A4縦']]},
    {key:'numberStyle',label:'番号',type:'seg',value:p.numberStyle,options:[['kanji','漢数字'],['arabic','算用数字']]},
    {key:'nameOrder',label:'氏名欄',type:'seg',value:p.nameOrder,options:[['full','○年○組○番'],['short','○組○番']]},
    {key:'margin',label:'余白',type:'seg',value:String(p.marginX),options:[['8','狭い 8mm'],['10','10mm'],['12','12mm']]},
    {key:'showScoreBox',label:'観点別得点枠',type:'check',value:p.showScoreBox},
    {key:'backupAnswers',label:'一時保存に模範解答も含める',type:'check',value:options.backupAnswers,
      hint:'共用PCでは外したままを推奨します'},
    {key:'clearOnExit',label:'閉じるときに一時保存を消す',type:'check',value:options.clearOnExit}
  ]);
  if (!v) return;
  snapshot();
  p.grade = v.grade || '一'; p.term = v.term || ''; p.testName = v.testName || '';
  p.writing = v.writing; p.orientation = v.orientation; p.numberStyle = v.numberStyle;
  p.nameOrder = v.nameOrder; p.showScoreBox = !!v.showScoreBox;
  p.marginX = +v.margin; p.marginY = (+v.margin===8) ? 9 : +v.margin;
  p.title = makeTitle(p); p.nameLabel = makeNameLabel(p);
  doc.grid = computeGrid(p);
  ui.cur = { c: Math.min(ui.cur.c, doc.grid.cols-1), r: Math.min(ui.cur.r, doc.grid.rows-1) };
  options.backupAnswers = !!v.backupAnswers; options.clearOnExit = !!v.clearOnExit;
  saveOptions();
  render();
}
