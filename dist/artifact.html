/* ---------------------------------------------------------------
   20. 教科テンプレ（定期テストの標準構成）
   --------------------------------------------------------------- */
const TEMPLATES = {
  // 大問ごとにまとめる。縦書きは大問ごとに行（列）を分け、横書きは行を分ける。
  '国語':[ [{type:2,times:5}], [{type:4,tate:2,yoko:1,times:4}], [{type:3,n:50}] ],
  '数学':[ [{type:4,tate:1,yoko:6,times:4}], [{type:4,tate:5,yoko:8}], [{type:5,w:8,h:8}] ],
  '英語':[ [{type:2,times:5}], [{type:4,tate:1,yoko:6,times:4}], [{type:3,n:20}] ],
  '理科':[ [{type:2,times:5}], [{type:4,tate:1,yoko:4,times:4}], [{type:5,w:6,h:6}], [{type:3,n:30}] ],
  '社会':[ [{type:2,times:5}], [{type:4,tate:1,yoko:4,times:5}], [{type:3,n:40}] ]
};

function applyTemplate(subject){
  const groups = TEMPLATES[subject] || [];
  const vertical = doc.paper.writing==='vertical';
  const origin = contentOrigin(doc);
  const used = new Set(headerLayout(doc).reserved);
  const fits = rects => rects.every(r => {
    if (r.c<0||r.r<0||r.c+r.w>doc.grid.cols||r.r+r.h>doc.grid.rows) return false;
    for (let i=0;i<r.w;i++) for (let j=0;j<r.h;j++) if (used.has((r.c+i)+','+(r.r+j))) return false;
    return true;
  });
  const take = rects => rects.forEach(r => {
    for (let i=0;i<r.w;i++) for (let j=0;j<r.h;j++) used.add((r.c+i)+','+(r.r+j));
  });

  let head = { c:origin.c, r:origin.r };    // 今の大問の開始位置
  const labH = vertical ? 1 : CHAR_ROWS;
  const stepOn = (p) => vertical ? {c:p.c, r:p.r+labH} : {c:p.c+1, r:p.r};

  groups.forEach((group, gi) => {
    let cur = { c:head.c, r:head.r };
    let widest = 1, deepest = CHAR_ROWS;

    // 大問の先頭に大問番号（一 二 三…）を置く
    const dlab = labelRect(doc, cur);
    if (fits([dlab])){
      take([dlab]);
      doc.texts[cur.c+','+cur.r] = { t: STAMPS.D.fmt(gi+1, doc.paper.numberStyle),
                                     size: STAMPS.D.size, bold:true, box:true };
      cur = stepOn(cur);
    }
    const contentTop = { c:cur.c, r:cur.r };      // この大問の本文が始まる位置
    let no = 0;                                   // 小問の番号
    for (const step of group){
      for (let k=0; k<(step.times||1); k++){
        const opt = {n:step.n, w:step.w, h:step.h, tate:step.tate, yoko:step.yoko};
        const place = (at) => {
          const lab = labelRect(doc, at);
          const b = buildRects(doc, step.type, boxStart(doc, at), opt);
          return (b.error || !fits([lab]) || !fits(b.rects)) ? null : {lab, rects:b.rects};
        };
        let got = place(cur);
        if (!got){                                // 入らなければ行を開けずに改行
          cur = vertical ? { c:cur.c-1, r:contentTop.r } : { c:contentTop.c, r:cur.r + CHAR_ROWS };
          got = place(cur);
          if (!got) continue;
        }
        take([got.lab]); take(got.rects);
        doc.fields.push({ id:'f'+(uid++), type:step.type, rects:got.rects, label:got.lab,
          chars:(step.type===3 ? step.n : 1), exact:false,
          points:0, aspect:'知技', complete:false, note:'', notePos:'end' });
        no++;
        doc.texts[got.lab.c+','+got.lab.r] = { t: STAMPS.P.fmt(no), size: STAMPS.P.size };
        const last = got.rects[got.rects.length-1];
        widest  = Math.max(widest,  head.c - Math.min(got.lab.c, ...got.rects.map(r=>r.c)) + 1);
        deepest = Math.max(deepest, Math.max(got.lab.r+got.lab.h, ...got.rects.map(r=>r.r+r.h)) - head.r);
        cur = vertical ? { c:last.c, r:last.r + last.h }      // 次の番号欄へ（間は空けない）
                       : { c:last.c + last.w, r:last.r };
      }
    }
    // 次の大問へ。大問は行を分けるが、間に空の行は作らない
    if (vertical) head = { c: head.c - widest, r: origin.r };
    else          head = { c: origin.c, r: head.r + deepest };
  });
}

/* ---------------------------------------------------------------
   21. サイドバーのボタン（キーを印字し、小さな見本図を付ける）
   --------------------------------------------------------------- */
function icon(type){
  const g = (inner) => '<svg width="34" height="20" viewBox="0 0 34 20">'+inner+'</svg>';
  const box = (x,y,w,h,extra) => '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="#33404d" stroke-width="1"'+(extra||'')+'/>';
  switch(type){
    case 1: return g(box(3,3,28,14,' stroke-dasharray="3 2"'));                     // シンプル枠
    case 2: return g(box(12,4,10,12));                                              // 記号用
    case 3: return g(box(2,5,30,10)+
      '<line x1="10" y1="5" x2="10" y2="15" stroke="#33404d" stroke-dasharray="2 2"/>'+
      '<line x1="18" y1="5" x2="18" y2="15" stroke="#33404d" stroke-dasharray="2 2"/>'+
      '<line x1="25" y1="5" x2="25" y2="15" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="3 2"/>'); // 文字数
    case 4: return g(box(5,3,24,14));                                               // 長方形
    case 5: return g(box(5,2,24,16)+                                                // グラフ
      '<line x1="17" y1="2" x2="17" y2="18" stroke="#33404d"/>'+
      '<line x1="5" y1="10" x2="29" y2="10" stroke="#33404d"/>'+
      '<line x1="11" y1="2" x2="11" y2="18" stroke="#9aa7b4" stroke-dasharray="1.5 1.5"/>'+
      '<line x1="23" y1="2" x2="23" y2="18" stroke="#9aa7b4" stroke-dasharray="1.5 1.5"/>'+
      '<line x1="5" y1="6" x2="29" y2="6" stroke="#9aa7b4" stroke-dasharray="1.5 1.5"/>'+
      '<line x1="5" y1="14" x2="29" y2="14" stroke="#9aa7b4" stroke-dasharray="1.5 1.5"/>');
    default: return '';
  }
}

function buildTools(){
  const fw = $('#field-tools');
  fw.innerHTML = Object.keys(FIELD_DEFS).map(k =>
    '<button class="tool" data-field="'+k+'" title="'+FIELD_DEFS[k].hint+'">'+icon(+k)+
    '<span class="nm">'+FIELD_DEFS[k].name+'</span><span class="k">'+k+'</span></button>').join('');
  fw.querySelectorAll('[data-field]').forEach(b =>
    b.addEventListener('click', ()=>placeField(+b.dataset.field)));

  const sw = $('#stamp-tools');
  sw.innerHTML = Object.keys(STAMPS).map(k =>
    '<button class="tool" data-stamp="'+k+'"><span class="nm">'+STAMPS[k].name+'</span><span class="k">'+k+'</span></button>').join('');
  sw.querySelectorAll('[data-stamp]').forEach(b =>
    b.addEventListener('click', ()=>stamp(b.dataset.stamp)));

  // 線の太さ
  const bw = $('#basic-tools');
  bw.innerHTML =
    '<button class="tool line on" data-line="thin"><span class="nm">普通線</span><span class="k">Shift+1</span></button>'+
    '<button class="tool line" data-line="medium"><span class="nm">太線</span><span class="k">Shift+2</span></button>';
  bw.querySelectorAll('[data-line]').forEach(b => b.onclick = () => setLine(b.dataset.line));

  // その他
  const vertical = () => doc && doc.paper.writing==='vertical';
  const mw = $('#misc-tools');
  mw.innerHTML =
    '<button class="tool" id="t-ins"><span class="nm" id="nm-ins">挿入 ↓</span><span class="k">I</span></button>'+
    '<button class="tool" id="t-insl"><span class="nm" id="nm-insl">挿入 ←</span><span class="k">Shift+I</span></button>'+
    '<button class="tool" id="t-del"><span class="nm">消す</span><span class="k">Delete</span></button>'+
    '<button class="tool" id="t-clear"><span class="nm">全部消す</span></button>'+
    '<button class="tool" id="t-edit"><span class="nm">文字を入れる</span><span class="k">Enter</span></button>'+
    '<button class="tool" id="t-prop"><span class="nm">欄の設定</span><span class="k">Space</span></button>'+
    '<button class="tool" id="t-pick" style="grid-column:1/-1"><span class="nm">セルの選択（離れたマスを選ぶ）</span><span class="k">Shift+Space</span></button>';
  $('#t-ins').onclick   = insertCells;
  $('#t-insl').onclick  = insertLine;
  $('#t-del').onclick   = clearSelection;
  $('#t-clear').onclick = clearAll;
  $('#t-edit').onclick  = enterInput;
  $('#t-prop').onclick  = openFieldPopup;
  $('#t-pick').onclick = () => {
    const i = ui.extra.findIndex(q => q.c===ui.cur.c && q.r===ui.cur.r);
    if (i>=0) ui.extra.splice(i,1); else ui.extra.push({c:ui.cur.c, r:ui.cur.r});
    render();
    toast(ui.extra.length ? '選んだセル：'+ui.extra.length+'か所' : '選択を外しました');
  };
}

// 挿入ボタンの向きは、縦書き・横書きで入れ替わる
function updateInsertLabels(){
  const v = doc && doc.paper.writing==='vertical';
  const a = document.getElementById('nm-ins'), b = document.getElementById('nm-insl');
  if (a) a.textContent = v ? '挿入 ↓' : '挿入 →';
  if (b) b.textContent = v ? '挿入 ←' : '挿入 ↓';
}

/* ---------------------------------------------------------------
   22. 起動
   --------------------------------------------------------------- */
function startApp(){
  $('#start').style.display = 'none';
  $('#app').classList.add('on');
  ui.mode='place'; ui.tab='sheet'; ui.sel=null; ui.extra=[];
  ui.cur = Object.assign({}, contentOrigin(doc));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab==='sheet'));
  setModeBar();
  render();
}

function initStart(){
  const subjects = Object.keys(SUBJECTS);
  $('#tpl-row').innerHTML = Object.keys(TEMPLATES).map(s =>
    '<button class="subject-btn" data-tpl="'+s+'">'+s+'</button>').join('');
  $('#blank-row').innerHTML = subjects.map(s =>
    '<button class="subject-btn" data-blank="'+s+'">'+s+'</button>').join('');
  $('#tpl-row').addEventListener('click', e => {
    const b = e.target.closest('[data-tpl]'); if(!b) return;
    doc = newDoc(b.dataset.tpl); applyTemplate(b.dataset.tpl); startApp();
  });
  $('#blank-row').addEventListener('click', e => {
    const b = e.target.closest('[data-blank]'); if(!b) return;
    doc = newDoc(b.dataset.blank); startApp();
  });
  let bk = null;
  try { bk = localStorage.getItem(BK_KEY); } catch(e){}
  if (bk){
    const btn = $('#btn-resume');
    btn.disabled = false;
    btn.onclick = () => { try { loadWork(bk); } catch(e){ toast('前回の作業を開けませんでした'); } };
  }
  $('#btn-open').onclick = () => $('#file-open').click();
  $('#file-open').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { loadWork(rd.result); } catch(err){ alert('この作業ファイルは開けませんでした。'); } };
    rd.readAsText(f);
    e.target.value = '';
  });
}

/* 上部バーの配線 */
$('#btn-undo').onclick = undo;
$('#btn-redo').onclick = redo;
$('#btn-xlsx').onclick = exportXlsx;
$('#btn-pdf').onclick  = printSheet;
$('#btn-save').onclick = saveWork;
$('#btn-settings').onclick = openSettings;
$('#btn-zo').onclick   = ()=>setZoom(-1);
$('#btn-zi').onclick   = ()=>setZoom(1);
$('#btn-zfit').onclick = ()=>setZoom(0);
$('#title-input').addEventListener('change', e => {
  snapshot(); doc.paper.title = e.target.value; render();
});
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  if (ui.mode==='input') commitInput();
  ui.tab = t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x===t));
  ui.sel=null; ui.extra=[];
  render();
  toast(ui.tab==='answer' ? '模範解答タブ：欄の上で Enter を押すと答えを入れられます' : '解答用紙タブ');
});

/* 作業が消えないように確認する */
window.addEventListener('beforeunload', e => {
  if (options.clearOnExit){ try{ localStorage.removeItem(BK_KEY); }catch(err){} }
  else if (doc) backup();
  if (ui.dirty){ e.preventDefault(); e.returnValue = ''; return ''; }
});
setInterval(()=>{ if (doc && ui.dirty) backup(); }, 20000);

buildTools();
initStart();
</script>
